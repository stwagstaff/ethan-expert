<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Agent Ethan</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1a1714;
  --ink-muted: #6b6560;
  --ink-faint: #b0aaa5;
  --surface: #faf8f5;
  --surface-2: #f0ece6;
  --border: #ddd8d0;
  --accent: #8b4513;
  --accent-warm: #c4622d;
  --font-sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --sidebar-w: 180px;
  --topbar-h: 44px;
}
html, body { height: 100%; font-family: var(--font-sans); background: var(--surface); color: var(--ink); overflow: hidden; }

/* ══════════════════════════════════════
   TOP BAR
══════════════════════════════════════ */
#topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--topbar-h);
  background: #1a1714;
  display: flex; align-items: center;
  padding: 0 1rem;
  gap: 0.75rem;
  z-index: 100;
}
#topbar .brand {
  font-size: 0.82rem; font-weight: 700;
  color: #fff; letter-spacing: 0.01em;
  flex: 1;
}
#topbar .brand em { font-style: normal; color: #c4622d; }
#topbar a, #topbar button.topbtn {
  font-size: 0.78rem; color: rgba(255,255,255,0.45);
  text-decoration: none; background: none; border: none;
  cursor: pointer; padding: 0.2rem 0.4rem; border-radius: 3px;
}
#topbar a:hover, #topbar button.topbtn:hover { color: rgba(255,255,255,0.85); }

/* ══════════════════════════════════════
   APP SHELL
══════════════════════════════════════ */
#app {
  display: flex;
  height: 100dvh;
  padding-top: var(--topbar-h);
  overflow: hidden;
}

/* ══════════════════════════════════════
   SIDEBAR
══════════════════════════════════════ */
#sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: #242018;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid rgba(255,255,255,0.06);
}
.sidebar-section-label {
  font-size: 0.65rem; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(255,255,255,0.2);
  padding: 1rem 0.85rem 0.35rem;
}
.nav-link {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.55rem 0.85rem;
  font-size: 0.83rem; font-weight: 500;
  color: rgba(255,255,255,0.5);
  cursor: pointer; border: none; background: none;
  text-align: left; width: 100%;
  border-radius: 0;
  transition: background 0.12s, color 0.12s;
}
.nav-link:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
.nav-link.active { background: rgba(196,98,45,0.18); color: #fff; }
.nav-link .icon { font-size: 0.9rem; flex-shrink: 0; width: 1.1rem; text-align: center; }
.nav-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 0.5rem 0; }
.persona-link {
  display: block;
  padding: 0.4rem 0.85rem 0.4rem 1.1rem;
  font-size: 0.8rem;
  color: rgba(255,255,255,0.38);
  cursor: pointer; border: none; background: none;
  text-align: left; width: 100%;
  border-left: 2px solid transparent;
  transition: all 0.12s;
}
.persona-link:hover { color: rgba(255,255,255,0.7); }
.persona-link.active {
  color: #c4622d;
  border-left-color: #c4622d;
  background: rgba(196,98,45,0.08);
}

/* ══════════════════════════════════════
   MAIN CONTENT
══════════════════════════════════════ */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* ══════════════════════════════════════
   LOGIN
══════════════════════════════════════ */
#loginScreen {
  flex: 1; display: flex;
  align-items: center; justify-content: center;
  background: var(--surface);
}
#loginBox {
  background: #fff; border: 1px solid var(--border);
  border-radius: 8px; padding: 2.25rem;
  width: 340px; display: flex; flex-direction: column; gap: 1rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}
#loginBox h2 { font-size: 1rem; font-weight: 700; }
#loginBox label { font-size: 0.75rem; font-weight: 600; color: var(--ink-muted); display: block; margin-bottom: 0.25rem; }
#loginBox input {
  width: 100%; border: 1px solid var(--border); border-radius: 4px;
  padding: 0.55rem 0.75rem; font-size: 0.9rem;
}
#loginBox input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
#loginBox button {
  background: var(--accent); color: #fff; border: none;
  border-radius: 4px; padding: 0.6rem 1.1rem;
  font-size: 0.88rem; font-weight: 600; cursor: pointer; align-self: flex-start;
}
#loginBox button:hover { background: var(--accent-warm); }
#loginErr { font-size: 0.8rem; color: #c0392b; min-height: 1em; }

/* ══════════════════════════════════════
   PAGE WRAPPER
══════════════════════════════════════ */
.page { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.page.visible { display: flex; }

/* ══════════════════════════════════════
   CHAT PAGE
══════════════════════════════════════ */
#chatMessages {
  flex: 1; overflow-y: auto;
  padding: 1.25rem 1.5rem;
  display: flex; flex-direction: column; gap: 0.8rem;
  max-width: 820px; width: 100%;
  margin: 0 auto; align-self: stretch;
}
.chat-msg {
  max-width: 82%; padding: 0.65rem 0.95rem;
  border-radius: 12px; font-size: 0.875rem;
  line-height: 1.6; white-space: pre-wrap;
}
.chat-msg.bot { align-self: flex-start; background: #fff; border: 1px solid var(--border); color: var(--ink); }
.chat-msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
.chat-msg.note { align-self: center; background: none; color: var(--ink-faint); font-size: 0.76rem; font-style: italic; max-width: 100%; text-align: center; }
#chatTyping {
  display: none; align-self: flex-start;
  background: #fff; border: 1px solid var(--border);
  border-radius: 12px; padding: 0.55rem 0.95rem;
  font-size: 0.82rem; color: var(--ink-muted); font-style: italic;
}
#chatInputRow {
  border-top: 1px solid var(--border); padding: 0.85rem 1.5rem;
  background: #fff; display: flex; gap: 0.6rem;
  max-width: 820px; width: 100%; margin: 0 auto; align-self: stretch;
}
#chatInput {
  flex: 1; border: 1px solid var(--border); border-radius: 8px;
  padding: 0.6rem 0.85rem; font-size: 0.875rem; font-family: inherit;
  resize: none; height: 44px; max-height: 140px; background: var(--surface);
}
#chatInput:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
#chatSendBtn {
  background: var(--accent); color: #fff; border: none;
  border-radius: 8px; padding: 0 1.1rem;
  font-size: 0.875rem; font-weight: 600; cursor: pointer; flex-shrink: 0;
}
#chatSendBtn:hover { background: var(--accent-warm); }
#chatSendBtn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ══════════════════════════════════════
   A/B PAGE
══════════════════════════════════════ */
#abPage { background: var(--surface); }

/* Questions bar — horizontal strip above columns */
#abQBar {
  border-bottom: 1px solid var(--border);
  background: #fff;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}
#abQBarTop {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.6rem 0.85rem;
}
#abQBarTop h4 {
  font-size: 0.68rem; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-faint); flex-shrink: 0;
}
#abPersonaLabel {
  font-size: 0.8rem; color: var(--ink-muted);
  font-style: italic; flex: 1;
}
#abGenBtn {
  padding: 0.3rem 0.7rem; font-size: 0.76rem; font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 4px; cursor: pointer; color: var(--ink-muted);
  flex-shrink: 0;
}
#abGenBtn:disabled { opacity: 0.45; cursor: not-allowed; }
#abQList {
  display: flex; flex-wrap: wrap; gap: 0.35rem;
  padding: 0 0.85rem 0.65rem;
  max-height: 80px; overflow-y: auto;
}
#abQEditWrap {
  display: flex;
  gap: 0.5rem;
  align-items: flex-start;
  padding: 0 0.85rem 0.65rem;
  border-top: 1px solid var(--border);
  padding-top: 0.5rem;
}
#abQEdit {
  flex: 1;
  height: 72px;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.4rem 0.6rem;
  font-size: 0.78rem;
  font-family: var(--font-mono);
  resize: vertical;
  background: #fff;
  color: var(--ink);
}
#abQEdit:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
#abQSaveBtn {
  padding: 0.35rem 0.75rem;
  font-size: 0.76rem; font-weight: 600;
  background: var(--accent); color: #fff;
  border: none; border-radius: 4px; cursor: pointer;
  white-space: nowrap; flex-shrink: 0;
}
#abQSaveBtn:hover { background: var(--accent-warm); }
.ab-q-btn {
  padding: 0.3rem 0.65rem;
  font-size: 0.78rem; line-height: 1.35;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 20px; cursor: pointer; color: var(--ink);
  transition: background 0.12s, border-color 0.12s;
}
.ab-q-btn:hover { background: var(--accent-light, #f5ede5); border-color: var(--accent); color: var(--accent); }
.ab-q-btn.running { opacity: 0.4; pointer-events: none; }
.ab-q-empty { font-size: 0.8rem; color: var(--ink-faint); font-style: italic; padding: 0.15rem 0; }

/* Response columns */
#abColumns {
  display: flex; flex: 1; min-height: 0; overflow: hidden;
}
.ab-col {
  flex: 1; display: flex; flex-direction: column;
  min-width: 0; border-right: 1px solid var(--border); overflow: hidden;
}
.ab-col:last-child { border-right: none; }
.ab-col-head {
  padding: 0.5rem 0.85rem;
  font-size: 0.68rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.a-head { color: #2471a3; background: #eaf4fb; }
.b-head { color: #8b4513; background: #fdf3ee; }
.ab-col-body {
  flex: 1; overflow-y: auto; padding: 0.85rem;
  font-size: 0.875rem; line-height: 1.65; color: var(--ink); white-space: pre-wrap;
}
.ab-placeholder { color: var(--ink-faint); font-style: italic; font-size: 0.82rem; }
.ab-running { color: var(--ink-muted); font-style: italic; }
.ab-qlabel { font-size: 0.73rem; color: var(--ink-faint); margin-bottom: 0.6rem; font-style: italic; }

/* Prompt bar — bottom strip */
#abPromptBar {
  border-top: 1px solid var(--border);
  background: #fffbf7;
  flex-shrink: 0;
  display: flex; align-items: flex-start; gap: 0.6rem;
  padding: 0.6rem 0.85rem;
}
#abPromptBar label {
  font-size: 0.68rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-faint); flex-shrink: 0; padding-top: 0.35rem;
}
#abDraftPrompt {
  flex: 1; height: 68px;
  border: 1px solid var(--border); border-radius: 4px;
  padding: 0.45rem 0.65rem;
  font-size: 0.78rem; font-family: var(--font-mono);
  resize: vertical; background: #fff;
}
#abDraftPrompt:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
#abPromptActions { display: flex; flex-direction: column; gap: 0.3rem; flex-shrink: 0; }
#abPromptActions button {
  padding: 0.32rem 0.65rem; font-size: 0.75rem; font-weight: 600;
  border-radius: 4px; cursor: pointer; white-space: nowrap; border: none;
}
.ab-load-btn { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border) !important; }
.ab-promote-btn { background: #27ae60; color: #fff; }
.ab-promote-btn:hover { background: #219a52; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="brand">🕵️ Secret Agent <em>Ethan</em></div>
  <a href="/" target="_blank">← Live site</a>
  <button class="topbtn" id="signOutBtn" style="display:none" onclick="signOut()">Sign out</button>
</div>

<div id="app">

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sidebar-section-label">Tools</div>
    <button class="nav-link active" id="nav-chat" onclick="showPage('chat',this)">
      <span class="icon">💬</span> Chat Editor
    </button>
    <button class="nav-link" id="nav-ab" onclick="showPage('ab',this)">
      <span class="icon">🔬</span> A/B Tester
    </button>

    <div class="nav-divider"></div>
    <div class="sidebar-section-label">Personas</div>
    <button class="persona-link active" onclick="abSidebarPersona('curious',this)">Curious</button>
    <button class="persona-link" onclick="abSidebarPersona('publisher',this)">Publisher</button>
    <button class="persona-link" onclick="abSidebarPersona('speaker',this)">Speaker</button>
    <button class="persona-link" onclick="abSidebarPersona('academic',this)">Academic</button>
    <button class="persona-link" onclick="abSidebarPersona('collaborator',this)">Collaborator</button>
    <button class="persona-link" onclick="abSidebarPersona('recruiter',this)">Recruiter</button>
  </nav>

  <!-- MAIN -->
  <div id="main">

    <!-- LOGIN -->
    <div id="loginScreen">
      <div id="loginBox">
        <h2>🔐 Admin Login</h2>
        <div>
          <label>Password</label>
          <input type="password" id="loginPw" placeholder="Enter password…" autocomplete="off"
                 onkeydown="if(event.key==='Enter') doLogin()">
        </div>
        <button onclick="doLogin()">Sign in →</button>
        <div id="loginErr"></div>
      </div>
    </div>

    <!-- CHAT PAGE -->
    <div class="page" id="chatPage">
      <div id="chatMessages">
        <div id="chatTyping">Thinking…</div>
      </div>
      <div id="chatInputRow">
        <textarea id="chatInput" placeholder="Tell me what you'd like to change…"
                  onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatSend()}"
                  oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,140)+'px'"></textarea>
        <button id="chatSendBtn" onclick="chatSend()">Send</button>
      </div>
    </div>

    <!-- A/B PAGE -->
    <div class="page" id="abPage">

      <!-- Questions strip -->
      <div id="abQBar">
        <div id="abQBarTop">
          <h4>Questions</h4>
          <span id="abPersonaLabel">Curious visitor</span>
          <button id="abGenBtn" onclick="abGenerateQuestions()">⟳ Regenerate</button>
        </div>
        <!-- Click-to-run pills -->
        <div id="abQList">
          <span class="ab-q-empty">Loading…</span>
        </div>
        <!-- Editable textarea — always visible so Ethan can manually tweak -->
        <div id="abQEditWrap">
          <textarea id="abQEdit" placeholder="One question per line — edit freely, then click Save"></textarea>
          <button id="abQSaveBtn" onclick="abSaveQuestions()">Save questions</button>
        </div>
      </div>

      <!-- Side-by-side responses -->
      <div id="abColumns">
        <div class="ab-col">
          <div class="ab-col-head a-head">A — Live prompt</div>
          <div class="ab-col-body" id="abColA">
            <span class="ab-placeholder">Pick a question above to run a comparison.</span>
          </div>
        </div>
        <div class="ab-col">
          <div class="ab-col-head b-head">B — Draft prompt</div>
          <div class="ab-col-body" id="abColB">
            <span class="ab-placeholder">Pick a question above to run a comparison.</span>
          </div>
        </div>
      </div>

      <!-- B prompt bar -->
      <div id="abPromptBar">
        <label>B Draft</label>
        <textarea id="abDraftPrompt"
                  placeholder="Paste or edit a draft system prompt here — leave blank to use the live prompt for both columns…"></textarea>
        <div id="abPromptActions">
          <button class="ab-load-btn" onclick="abLoadLivePrompt()">↓ Load live</button>
          <button class="ab-promote-btn" onclick="abPromoteB()">✓ Promote B → Live</button>
        </div>
      </div>

    </div><!-- /abPage -->

  </div><!-- /main -->
</div><!-- /app -->

<script>
const PROXY = 'https://ethan-expert-proxy.threedwag.workers.dev';
let adminPw = '';

// ── SIGN OUT ─────────────────────────────────────────────────────
function signOut() {
  adminPw = '';
  chatHistory = [];
  document.getElementById('loginPw').value = '';
  document.getElementById('loginErr').textContent = '';
  document.getElementById('signOutBtn').style.display = 'none';
  document.querySelectorAll('.page').forEach(p => p.classList.remove('visible'));
  document.getElementById('loginScreen').style.display = 'flex';
}

// ── PAGE ROUTING ─────────────────────────────────────────────────
function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('visible'));
  document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
  document.getElementById(name + 'Page').classList.add('visible');
  btn.classList.add('active');
  if (name === 'ab' && !abLivePrompt) abLoadQuestions();
  if (name === 'chat') document.getElementById('chatInput').focus();
}

// ── LOGIN ─────────────────────────────────────────────────────────
async function doLogin() {
  const pw = document.getElementById('loginPw').value.trim();
  const err = document.getElementById('loginErr');
  if (!pw) { err.textContent = 'Enter the password.'; return; }
  err.textContent = 'Checking…';
  try {
    const res = await fetch(`${PROXY}/admin/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Admin-Password': pw },
      body: JSON.stringify({ messages: [{ role: 'user', content: 'Hello' }] }),
    });
    if (res.status === 401) { err.textContent = 'Wrong password.'; return; }
    const data = await res.json();
    adminPw = pw;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('signOutBtn').style.display = '';
    document.getElementById('chatPage').classList.add('visible');
    document.getElementById('nav-chat').classList.add('active');
    chatAddMsg('bot', data.reply || 'Hello! What would you like to change?');
    document.getElementById('chatInput').focus();
  } catch (e) { err.textContent = 'Error: ' + e.message; }
}

// ── CHAT ──────────────────────────────────────────────────────────
let chatHistory = [];

function chatAddMsg(role, text) {
  const msgs = document.getElementById('chatMessages');
  const typing = document.getElementById('chatTyping');
  const div = document.createElement('div');
  div.className = 'chat-msg ' + role;
  div.textContent = text;
  msgs.insertBefore(div, typing);
  msgs.scrollTop = msgs.scrollHeight;
}

function chatAddNote(text) {
  const msgs = document.getElementById('chatMessages');
  const typing = document.getElementById('chatTyping');
  const div = document.createElement('div');
  div.className = 'chat-msg note';
  div.textContent = text;
  msgs.insertBefore(div, typing);
  msgs.scrollTop = msgs.scrollHeight;
}

async function chatSend() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !adminPw) return;
  input.value = ''; input.style.height = 'auto';
  document.getElementById('chatSendBtn').disabled = true;
  chatAddMsg('user', text);
  chatHistory.push({ role: 'user', content: text });
  const typing = document.getElementById('chatTyping');
  typing.style.display = 'block';
  document.getElementById('chatMessages').scrollTop = 99999;
  try {
    const res = await fetch(`${PROXY}/admin/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Admin-Password': adminPw },
      body: JSON.stringify({ messages: chatHistory }),
    });
    typing.style.display = 'none';
    if (res.status === 401) { chatAddNote('Session expired — sign in again.'); signOut(); return; }
    const data = await res.json();
    const reply = data.reply || 'No response.';
    chatHistory.push({ role: 'assistant', content: reply });
    chatAddMsg('bot', reply);
    if (reply.toLowerCase().includes('saved')) abLoadLivePrompt().catch(() => {});
  } catch (e) {
    typing.style.display = 'none';
    chatAddNote('Error: ' + e.message);
  } finally {
    document.getElementById('chatSendBtn').disabled = false;
    document.getElementById('chatInput').focus();
  }
}

// ── A/B TESTER ────────────────────────────────────────────────────
let abPersona = 'curious';
let abQuestionCache = {};  // persona -> [questions], loaded from KV + editable
let abLivePrompt = '';

const AB_PERSONA_LABELS = {
  curious:      'Curious visitor',
  publisher:    'Publisher / agent',
  speaker:      'Speaker booker',
  academic:     'Academic / researcher',
  collaborator: 'Collaborator',
  recruiter:    'Recruiter',
};

const AB_PERSONA_DESCRIPTIONS = {
  curious:      'a curious general reader who has just discovered Ethan Watters and wants to understand who he is and what he has written',
  publisher:    'a book publisher or literary agent evaluating Ethan as a potential author for a new project',
  speaker:      'an event organizer or conference producer looking to book Ethan as a keynote speaker',
  academic:     'an academic or researcher who has encountered his work and wants to understand its scholarly significance',
  collaborator: 'a potential creative or professional collaborator exploring whether Ethan would be a good partner for a project',
  recruiter:    'a recruiter or hiring manager considering Ethan for a senior editorial, strategy, or content role',
};

function abSidebarPersona(persona, btn) {
  abPersona = persona;
  document.querySelectorAll('.persona-link').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('abPersonaLabel').textContent = AB_PERSONA_LABELS[persona];
  abRenderQuestions();
  if (!document.getElementById('abPage').classList.contains('visible')) {
    showPage('ab', document.getElementById('nav-ab'));
    document.getElementById('nav-chat').classList.remove('active');
  }
}

function abRenderQuestions() {
  const list = document.getElementById('abQList');
  const edit = document.getElementById('abQEdit');
  const qs = abQuestionCache[abPersona];
  if (!qs || !qs.length) {
    list.innerHTML = '<span class="ab-q-empty">No questions yet — click Regenerate or type them in below.</span>';
    edit.value = '';
    return;
  }
  list.innerHTML = qs.map(q => {
    const escaped = q.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    return `<button class="ab-q-btn" data-question="${escaped}" onclick="abRunQuestion(this, this.dataset.question)">${q}</button>`;
  }).join('');
  edit.value = qs.join('\n');
}

// Load ab_questions from KV on page open
async function abLoadQuestions() {
  try {
    const res = await fetch(`${PROXY}/config`);
    const { config } = await res.json();
    if (config?.ab_questions && typeof config.ab_questions === 'object') {
      // Merge into cache (KV has { persona: [q,q,q] })
      Object.assign(abQuestionCache, config.ab_questions);
    }
    abLivePrompt = config?.system_prompt || '';
    document.getElementById('abDraftPrompt').value = abLivePrompt;
  } catch (e) { /* silent */ }
  abRenderQuestions();
}

// Save current textarea content for this persona to KV
async function abSaveQuestions() {
  const raw = document.getElementById('abQEdit').value.trim();
  const qs = raw.split('\n').map(l => l.trim()).filter(Boolean);
  abQuestionCache[abPersona] = qs;
  abRenderQuestions();

  const saveBtn = document.getElementById('abQSaveBtn');
  saveBtn.textContent = 'Saving…'; saveBtn.disabled = true;
  try {
    const res = await fetch(`${PROXY}/admin`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Admin-Password': adminPw },
      body: JSON.stringify({ ab_questions: abQuestionCache }),
    });
    const data = await res.json();
    saveBtn.textContent = data.ok ? '✓ Saved' : '✗ Error';
    setTimeout(() => { saveBtn.textContent = 'Save questions'; saveBtn.disabled = false; }, 1800);
  } catch (e) {
    saveBtn.textContent = '✗ Error'; saveBtn.disabled = false;
  }
}

async function abGenerateQuestions() {
  const btn = document.getElementById('abGenBtn');
  btn.textContent = '⟳ Generating…'; btn.disabled = true;
  document.getElementById('abQList').innerHTML = '<span class="ab-q-empty">Generating…</span>';
  try {
    const res = await fetch(`${PROXY}/admin/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Admin-Password': adminPw },
      body: JSON.stringify({
        messages: [{
          role: 'user',
          content: `Generate exactly 10 realistic questions that ${AB_PERSONA_DESCRIPTIONS[abPersona]} would ask the EthanExpert AI.\nReturn ONLY a numbered list 1–10, one question per line, no extra commentary. Make them varied — some specific to his books, some about his career, some about opportunities.`,
        }],
      }),
    });
    const data = await res.json();
    const questions = (data.reply || '').split('\n')
      .map(l => l.replace(/^\d+[\.\)–\-]\s*/, '').trim())
      .filter(l => l.length > 10)
      .slice(0, 10);
    abQuestionCache[abPersona] = questions;
    abRenderQuestions();
    // Auto-save to KV
    await fetch(`${PROXY}/admin`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Admin-Password': adminPw },
      body: JSON.stringify({ ab_questions: abQuestionCache }),
    });
  } catch (e) {
    document.getElementById('abQList').innerHTML =
      `<span class="ab-q-empty" style="color:#c0392b">Error: ${e.message}</span>`;
  } finally {
    btn.textContent = '⟳ Regenerate'; btn.disabled = false;
  }
}

async function abLoadLivePrompt() {
  try {
    const res = await fetch(`${PROXY}/config`);
    const { config } = await res.json();
    abLivePrompt = config?.system_prompt || '';
    document.getElementById('abDraftPrompt').value = abLivePrompt;
  } catch (e) { /* silent */ }
}

function renderMarkdown(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`(.*?)`/g, '<code>$1</code>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^[-•] (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)/g, m => `<ul>${m}</ul>`)
    .split(/\n\n+/)
    .map(para => {
      para = para.trim();
      if (!para) return '';
      if (/^<(h3|ul|blockquote)/.test(para)) return para;
      return `<p>${para.replace(/\n/g, '<br>')}</p>`;
    })
    .join('');
}

async function abRunQuestion(btn, question) {
  document.querySelectorAll('.ab-q-btn').forEach(b => b.classList.remove('running'));
  btn.classList.add('running');
  const colA = document.getElementById('abColA');
  const colB = document.getElementById('abColB');
  const draft = document.getElementById('abDraftPrompt').value.trim();
  const live  = abLivePrompt;
  const label = `<div class="ab-qlabel">"${question}"</div>`;
  colA.innerHTML = label + '<div class="ab-running">Running A…</div>';
  colB.innerHTML = label + '<div class="ab-running">Running B…</div>';

  async function call(prompt) {
    const body = {
      model: 'claude-sonnet-4-6',
      messages: [{ role: 'user', content: question }],
      max_tokens: 800,
    };
    // Only include system if we have one — Worker will inject KV prompt if absent
    if (prompt) body.system = prompt + `\n\n[USER MODE: ${abPersona}]`;
    const res = await fetch(PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    return data.content?.[0]?.text || '(no response)';
  }

  const [rA, rB] = await Promise.allSettled([call(live), call(draft || live)]);
  colA.innerHTML = label + (rA.status === 'fulfilled'
    ? renderMarkdown(rA.value)
    : `<span style="color:#c0392b">Error: ${rA.reason?.message}</span>`);
  colB.innerHTML = label + (rB.status === 'fulfilled'
    ? renderMarkdown(rB.value)
    : `<span style="color:#c0392b">Error: ${rB.reason?.message}</span>`);
  btn.classList.remove('running');
}

async function abPromoteB() {
  const draft = document.getElementById('abDraftPrompt').value.trim();
  if (!draft) { alert('No draft prompt to promote.'); return; }
  if (!confirm('Promote B to live? This immediately affects all users.')) return;
  try {
    const res = await fetch(`${PROXY}/admin`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Admin-Password': adminPw },
      body: JSON.stringify({ system_prompt: draft }),
    });
    const data = await res.json();
    if (data.ok) {
      abLivePrompt = draft;
      const bHead = document.querySelector('.b-head');
      const orig = bHead.innerHTML;
      bHead.innerHTML = '✓ Promoted to live!';
      bHead.style.cssText = 'background:#d5f5e3;color:#27ae60';
      setTimeout(() => { bHead.innerHTML = orig; bHead.style.cssText = ''; }, 2500);
    } else { alert('Error: ' + (data.error || 'Unknown')); }
  } catch (e) { alert('Error: ' + e.message); }
}
