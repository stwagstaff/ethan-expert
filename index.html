<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who is Ethan Watters?</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #1a1008;
  --border:  #3a2a1a;
  --text:    #e8e8e8;
  --muted:   #888;
  --faint:   #4a3a2a;
  --accent:  #c4622d;
  --font:    'Georgia', serif;
  --mono:    system-ui, -apple-system, sans-serif;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
}

/* ── APP SHELL ── */
#app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 680px;
  margin: 0 auto;
  padding: 0 1.5rem;
}

/* ── HEADER (shown during chat) ── */
#header {
  padding: 2rem 0 0;
  flex-shrink: 0;
  display: none;        /* hidden until chat starts */
}
#header.visible { display: block; }
#header-name {
  font-size: 1rem;
  font-weight: normal;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-family: var(--mono);
}
#header-name em { font-style: normal; color: var(--accent); }

/* ── HERO (centered on first load) ── */
#hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding-bottom: 8vh;   /* shift slightly above true center */
  gap: 2rem;
}
#hero.hidden { display: none; }

#hero-title {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
#hero-title-main {
  font-size: clamp(1.6rem, 4vw, 2.2rem);
  font-weight: normal;
  letter-spacing: -0.01em;
  color: var(--text);
  line-height: 1.15;
}
#hero-title-main em {
  font-style: normal;
  color: var(--accent);
}
#hero-subtitle {
  font-size: 0.85rem;
  color: var(--muted);
  font-family: var(--mono);
  letter-spacing: 0.04em;
}

#hero-question {
  font-size: 1.05rem;
  line-height: 1.7;
  color: var(--text);
}

#hero-input-area {
  width: 100%;
  border-top: 1px solid var(--border);
  padding-top: 0.75rem;
}

/* ── MESSAGES (shown during chat) ── */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem 0 1rem;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
  scrollbar-width: none;
  display: none;     /* hidden until chat starts */
}
#messages.visible { display: flex; }
#messages::-webkit-scrollbar { display: none; }

.msg { display: flex; flex-direction: column; gap: 0.25rem; }

.msg-text {
  font-size: 1.05rem;
  line-height: 1.7;
  color: var(--text);
}
.msg-text p { margin-bottom: 0.75em; }
.msg-text p:last-child { margin-bottom: 0; }
.msg-text strong { color: #fff; font-weight: 600; }
.msg-text em { color: var(--muted); font-style: italic; }
.msg-text ul { padding-left: 1.2em; margin: 0.5em 0; }
.msg-text li { margin-bottom: 0.3em; }
.msg-text h3 { font-size: 1rem; font-weight: 600; margin: 0.75em 0 0.35em; color: #fff; }
.msg-text blockquote {
  border-left: 2px solid var(--border);
  padding-left: 1em;
  color: var(--muted);
  font-style: italic;
}
.msg.user .msg-text { color: var(--muted); font-size: 0.95rem; }

/* ── PERSONA CHOICES ── */
.persona-choices { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem; }
.persona-choice {
  background: none; border: none;
  border-left: 1px solid var(--border);
  padding: 0.4rem 0 0.4rem 1rem;
  font-family: var(--font); font-size: 0.95rem;
  color: var(--muted); cursor: pointer; text-align: left;
  transition: color 0.15s, border-color 0.15s;
}
.persona-choice:hover { color: var(--text); border-left-color: var(--accent); }

/* ── TYPING ── */
#typing {
  display: none; gap: 5px; align-items: center; height: 1.5rem;
}
#typing span {
  width: 5px; height: 5px; background: var(--muted);
  border-radius: 50%; animation: pulse 1.2s ease-in-out infinite;
}
#typing span:nth-child(2) { animation-delay: 0.2s; }
#typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse {
  0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
  40%           { opacity: 1;   transform: scale(1); }
}

/* ── CHAT INPUT AREA (bottom, shown during chat) ── */
#chat-input-area {
  flex-shrink: 0;
  padding: 0.75rem 0 1.5rem;
  border-top: 1px solid var(--border);
  display: none;    /* hidden until chat starts */
}
#chat-input-area.visible { display: block; }

/* ── SHARED INPUT STYLES ── */
.input-wrap { display: flex; align-items: flex-end; gap: 0.75rem; }
.input-field {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-family: var(--font);
  font-size: 1rem; line-height: 1.6; resize: none;
  height: 2rem; max-height: 8rem; padding: 0.2rem 0;
  caret-color: var(--accent);
}
.input-field::placeholder { color: var(--faint); }
.send-hint {
  font-size: 0.72rem; color: var(--faint);
  font-family: var(--mono); flex-shrink: 0; padding-bottom: 0.3rem;
}
</style>
</head>
<body>
<div id="app">

  <!-- Small header shown only during chat -->
  <div id="header">
    <span id="header-name">Ask <em>EthanExpert</em></span>
  </div>

  <!-- Hero — centered on first load, hidden once chat starts -->
  <div id="hero">
    <div id="hero-title">
      <div id="hero-title-main">Ask <em>EthanExpert</em></div>
      <div id="hero-subtitle">Explore the world of Ethan Watters</div>
    </div>
    <div id="hero-question"><!-- Agent's first question goes here --></div>
    <div id="hero-input-area">
      <div class="input-wrap">
        <textarea id="hero-input" class="input-field" placeholder="Type here…" rows="1"
          onkeydown="handleKey(event, 'hero')"
          oninput="autoResize(this)"></textarea>
        <span class="send-hint">↵ send</span>
      </div>
    </div>
  </div>

  <!-- Messages — shown once chat starts -->
  <div id="messages">
    <div id="typing"><span></span><span></span><span></span></div>
  </div>

  <!-- Bottom input — shown once chat starts -->
  <div id="chat-input-area">
    <div class="input-wrap">
      <textarea id="chat-input" class="input-field" placeholder="Type here…" rows="1"
        onkeydown="handleKey(event, 'chat')"
        oninput="autoResize(this)"></textarea>
      <span class="send-hint">↵ send</span>
    </div>
  </div>

</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────
const PROXY = 'https://ethan-expert-proxy.threedwag.workers.dev';

const SYSTEM_PROMPT_FALLBACK = `You are EthanExpert — a deeply informed AI representative for Ethan Watters, American journalist and author (Crazy Like Us, Urban Tribes, Making Monsters). Answer questions about his work, career, ideas, and opportunities. Be warm, precise, evidence-based. Never invent facts.`;

// ── STATE ─────────────────────────────────────────────────────────
let systemPrompt = SYSTEM_PROMPT_FALLBACK;
let currentMode  = 'curious';
let history      = [];
let busy         = false;
let chatStarted  = false;

const PERSONAS = [
  { key: 'curious',      label: 'Curious reader' },
  { key: 'publisher',    label: 'Publisher or editor' },
  { key: 'speaker',      label: 'Event organizer or booker' },
  { key: 'academic',     label: 'Researcher or academic' },
  { key: 'collaborator', label: 'Potential collaborator' },
  { key: 'recruiter',    label: 'Recruiter or hiring manager' },
  { key: 'other',        label: 'Something else' },
];

let flowState = 'waiting_topic';
let userTopic = '';

// ── INIT ──────────────────────────────────────────────────────────
async function init() {
  if (new URLSearchParams(window.location.search).has('secret-agent-ethan')) {
    window.location.href = '/admin.html';
    return;
  }

  try {
    const res  = await fetch(`${PROXY}/config`);
    const { config } = await res.json();
    if (config?.system_prompt) systemPrompt = config.system_prompt;
  } catch (e) { /* use fallback */ }

  // Show first question in the hero
  await heroSays("What do you want to know?");
  document.getElementById('hero-input').focus();
}

// ── HERO MODE ─────────────────────────────────────────────────────
async function heroSays(text, htmlExtra) {
  showTypingHero(true);
  await delay(420);
  showTypingHero(false);
  const q = document.getElementById('hero-question');
  q.innerHTML = renderMarkdown(text) + (htmlExtra || '');
}

function showTypingHero(on) {
  // Reuse the typing indicator inside hero-question while waiting
  const q = document.getElementById('hero-question');
  if (on) q.innerHTML = '<div style="display:flex;gap:5px;align-items:center;height:1.5rem">' +
    '<span style="width:5px;height:5px;background:var(--muted);border-radius:50%;animation:pulse 1.2s ease-in-out infinite"></span>'.repeat(3) +
    '</div>';
}

// ── SWITCH FROM HERO TO CHAT LAYOUT ───────────────────────────────
function switchToChatLayout() {
  if (chatStarted) return;
  chatStarted = true;
  document.getElementById('hero').classList.add('hidden');
  document.getElementById('header').classList.add('visible');
  document.getElementById('messages').classList.add('visible');
  document.getElementById('chat-input-area').classList.add('visible');
  document.getElementById('chat-input').focus();
}

// ── INPUT HANDLING ────────────────────────────────────────────────
function handleKey(e, source) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submit(source);
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 128) + 'px';
}

async function submit(source) {
  if (busy) return;
  const el = document.getElementById(source === 'hero' ? 'hero-input' : 'chat-input');
  const text = el.value.trim();
  if (!text) return;
  el.value = '';
  el.style.height = 'auto';
  await handleUserInput(text);
}

// ── CONVERSATION FLOW ─────────────────────────────────────────────
async function handleUserInput(text) {
  busy = true;

  if (flowState === 'waiting_topic') {
    userTopic = text;
    // Switch layout before showing any messages
    switchToChatLayout();
    userSaid(text);
    history.push({ role: 'user', content: text });
    flowState = 'waiting_persona';
    await agentSays("Who are you?", buildPersonaChoices());

  } else if (flowState === 'waiting_persona') {
    userSaid(text);
    setPersonaFromText(text);
    history.push({ role: 'user', content: text });
    flowState = 'chatting';
    await sendToAgent();

  } else {
    userSaid(text);
    history.push({ role: 'user', content: text });
    await sendToAgent();
  }

  busy = false;
}

function buildPersonaChoices() {
  return '<div class="persona-choices">' +
    PERSONAS.map(p =>
      `<button class="persona-choice" onclick="choosePersona('${p.key}','${escapeAttr(p.label)}')">${p.label}</button>`
    ).join('') +
    '</div>';
}

async function choosePersona(key, label) {
  if (busy) return;
  busy = true;
  document.querySelectorAll('.persona-choices').forEach(el => el.remove());
  currentMode = key;
  userSaid(label);
  history.push({ role: 'user', content: label });
  flowState = 'chatting';
  await sendToAgent();
  busy = false;
}

function setPersonaFromText(text) {
  const t = text.toLowerCase();
  for (const p of PERSONAS) {
    if (t.includes(p.key) || t.includes(p.label.toLowerCase())) {
      currentMode = p.key; return;
    }
  }
}

// ── AGENT CALL ────────────────────────────────────────────────────
async function sendToAgent() {
  showTyping(true);
  document.getElementById('chat-input').disabled = true;
  try {
    const res = await fetch(PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        system: systemPrompt + `\n\n[USER MODE: ${currentMode}]`,
        messages: history,
        max_tokens: 1500,
      }),
    });
    showTyping(false);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    const reply = data.content?.[0]?.text || '(no response)';
    history.push({ role: 'assistant', content: reply });
    agentSaid(reply);
  } catch (e) {
    showTyping(false);
    agentSaid(`*Something went wrong — ${e.message}*`);
  } finally {
    document.getElementById('chat-input').disabled = false;
    document.getElementById('chat-input').focus();
  }
}

// ── DOM HELPERS ───────────────────────────────────────────────────
function msgEl(role, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const t = document.createElement('div');
  t.className = 'msg-text';
  t.innerHTML = html;
  d.appendChild(t);
  return d;
}

function appendMsg(el) {
  const msgs = document.getElementById('messages');
  const typing = document.getElementById('typing');
  msgs.insertBefore(el, typing);
  msgs.scrollTop = msgs.scrollHeight;
}

function userSaid(text)  { appendMsg(msgEl('user',  escapeHtml(text))); }
function agentSaid(text) { appendMsg(msgEl('agent', renderMarkdown(text))); }

async function agentSays(text, htmlExtra) {
  showTyping(true);
  await delay(420);
  showTyping(false);
  appendMsg(msgEl('agent', renderMarkdown(text) + (htmlExtra || '')));
}

function showTyping(on) {
  document.getElementById('typing').style.display = on ? 'flex' : 'none';
  if (on) document.getElementById('messages').scrollTop = 99999;
}

// ── UTILITIES ─────────────────────────────────────────────────────
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
function escapeHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(t) { return t.replace(/'/g,"&#39;").replace(/"/g,'&quot;'); }

function renderMarkdown(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`(.*?)`/g, '<code>$1</code>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^[-•] (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)/g, m => `<ul>${m}</ul>`)
    .split(/\n\n+/)
    .map(para => {
      para = para.trim();
      if (!para) return '';
      if (/^<(h3|ul|blockquote)/.test(para)) return para;
      return `<p>${para.replace(/\n/g, '<br>')}</p>`;
    })
    .join('');
}

init();
</script>
</body>
</html>
