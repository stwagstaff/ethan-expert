<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who is Ethan Watters?</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #1a1008;
  --border:  #3a2a1a;
  --text:    #e8e8e8;
  --muted:   #888;
  --faint:   #4a3a2a;
  --accent:  #c4622d;
  --font:    'Georgia', serif;
  --mono:    system-ui, -apple-system, sans-serif;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
}

#app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 680px;
  margin: 0 auto;
  padding: 0 1.5rem;
}

/* ── SMALL HEADER (chat mode) ── */
#header {
  padding: 2rem 0 0;
  flex-shrink: 0;
  display: none;
}
#header.visible { display: block; }
#header-name {
  font-size: 0.9rem;
  font-weight: normal;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-family: var(--mono);
}
#header-name em { font-style: normal; color: var(--accent); }

/* ── HERO (first load) ── */
#hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding-bottom: 8vh;
  gap: 2rem;
}
#hero.hidden { display: none; }

#hero-title { display: flex; flex-direction: column; gap: 0.4rem; }
#hero-title-main {
  font-size: clamp(1.6rem, 4vw, 2.2rem);
  font-weight: normal;
  letter-spacing: -0.01em;
  color: var(--text);
  line-height: 1.15;
}
#hero-title-main em { font-style: normal; color: var(--accent); }
#hero-subtitle {
  font-size: 0.85rem;
  color: var(--muted);
  font-family: var(--mono);
  letter-spacing: 0.04em;
}
#hero-question {
  font-size: 1.05rem;
  line-height: 1.7;
  color: var(--text);
}
#hero-input-area {
  width: 100%;
  border-top: 1px solid var(--border);
  padding-top: 0.75rem;
}

/* ── SINGLE-EXCHANGE DISPLAY (chat mode) ── */
#exchange {
  flex: 1;
  display: none;
  flex-direction: column;
  justify-content: center;   /* vertically center the content */
  padding: 1.5rem 0;
  gap: 1.5rem;
  overflow: hidden;
}
#exchange.visible { display: flex; }

/* User's question — shown briefly, then fades */
#user-turn {
  font-size: 0.95rem;
  color: var(--muted);
  line-height: 1.6;
  opacity: 0;
  transition: opacity 0.25s ease;
  flex-shrink: 0;
}
#user-turn.show { opacity: 1; }
#user-turn.fade { opacity: 0; }

/* Agent's response — the main content */
#agent-turn {
  font-size: 1.05rem;
  line-height: 1.75;
  color: var(--text);
  overflow-y: auto;
  scrollbar-width: none;
  opacity: 0;
  transition: opacity 0.35s ease;
  max-height: 55vh;
}
#agent-turn::-webkit-scrollbar { display: none; }
#agent-turn.show { opacity: 1; }
#agent-turn p { margin-bottom: 0.75em; }
#agent-turn p:last-child { margin-bottom: 0; }
#agent-turn strong { color: #fff; font-weight: 600; }
#agent-turn em { color: var(--muted); font-style: italic; }
#agent-turn ul { padding-left: 1.2em; margin: 0.5em 0; }
#agent-turn li { margin-bottom: 0.3em; }
#agent-turn h3 { font-size: 1rem; font-weight: 600; margin: 0.75em 0 0.35em; color: #fff; }
#agent-turn blockquote {
  border-left: 2px solid var(--border);
  padding-left: 1em;
  color: var(--muted);
  font-style: italic;
}

/* Persona choices */
.persona-choices { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem; }
.persona-choice {
  background: none; border: none;
  border-left: 1px solid var(--border);
  padding: 0.4rem 0 0.4rem 1rem;
  font-family: var(--font); font-size: 0.95rem;
  color: var(--muted); cursor: pointer; text-align: left;
  transition: color 0.15s, border-color 0.15s;
}
.persona-choice:hover { color: var(--text); border-left-color: var(--accent); }

/* Typing dots */
#typing {
  display: none; gap: 5px; align-items: center; height: 1.5rem;
}
#typing span {
  width: 5px; height: 5px; background: var(--muted);
  border-radius: 50%; animation: pulse 1.2s ease-in-out infinite;
}
#typing span:nth-child(2) { animation-delay: 0.2s; }
#typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse {
  0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
  40%           { opacity: 1;   transform: scale(1); }
}

/* ── INPUT (chat mode) ── */
#chat-input-area {
  flex-shrink: 0;
  padding: 0.75rem 0 1.5rem;
  border-top: 1px solid var(--border);
  display: none;
}
#chat-input-area.visible { display: block; }

.input-wrap { display: flex; align-items: flex-end; gap: 0.75rem; }
.input-field {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-family: var(--font);
  font-size: 1rem; line-height: 1.6; resize: none;
  height: 2rem; max-height: 8rem; padding: 0.2rem 0;
  caret-color: var(--accent);
}
.input-field::placeholder { color: var(--faint); }
.send-hint {
  font-size: 0.72rem; color: var(--faint);
  font-family: var(--mono); flex-shrink: 0; padding-bottom: 0.3rem;
}

/* ════════════════════════════════════════
   LARGE SCREEN LAYOUT (≥ 768px)
   Left sidebar: title + question + input
   Right panel:  agent response
════════════════════════════════════════ */
@media (min-width: 768px) {

  #app {
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-rows: 1fr;
    max-width: 1200px;
    padding: 0;
    gap: 0;
    height: 100dvh;
  }

  /* ── LEFT SIDEBAR ── */
  #sidebar-col {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 3rem 2.5rem 3rem 3rem;
    border-right: 1px solid var(--border);
    height: 100dvh;
    gap: 2rem;
  }

  /* ── RIGHT CONTENT PANEL ── */
  #content-col {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 3rem 3rem 3rem 2.5rem;
    height: 100dvh;
    overflow: hidden;
  }

  /* Hide the small-screen single-column app wrapper internals */
  #app > #header,
  #app > #hero,
  #app > #exchange,
  #app > #chat-input-area { display: none !important; }

  /* Hero sidebar state */
  #sidebar-col #hero-title { display: flex; flex-direction: column; gap: 0.4rem; }
  #sidebar-col #hero-title-main {
    font-size: clamp(1.4rem, 2.5vw, 2rem);
    font-weight: normal;
    letter-spacing: -0.01em;
    color: var(--text);
    line-height: 1.15;
  }
  #sidebar-col #hero-title-main em { font-style: normal; color: var(--accent); }
  #sidebar-col #hero-subtitle {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: var(--mono);
    letter-spacing: 0.04em;
  }
  #sidebar-col #hero-question {
    font-size: 1rem;
    line-height: 1.7;
    color: var(--text);
  }
  #sidebar-col #hero-input-area {
    width: 100%;
    border-top: 1px solid var(--border);
    padding-top: 0.75rem;
  }
  #sidebar-col.hero-hidden #hero-title { display: flex; } /* keep title visible */

  /* Chat sidebar state — title + input */
  #sidebar-col #sidebar-header {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  #sidebar-col #sidebar-header-name {
    font-size: clamp(1.4rem, 2.5vw, 2rem);
    font-weight: normal;
    letter-spacing: -0.01em;
    color: var(--text);
    line-height: 1.15;
  }
  #sidebar-col #sidebar-header-name em { font-style: normal; color: var(--accent); }
  #sidebar-col #sidebar-header-sub {
    font-size: 0.8rem; color: var(--muted);
    font-family: var(--mono); letter-spacing: 0.04em;
  }
  #sidebar-col #sidebar-input-area {
    width: 100%;
    border-top: 1px solid var(--border);
    padding-top: 0.75rem;
  }

  /* Right panel content */
  #content-col #wide-exchange {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    overflow: hidden;
  }
  #content-col #wide-user-turn {
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.6;
    opacity: 0;
    transition: opacity 0.25s ease;
    flex-shrink: 0;
  }
  #content-col #wide-user-turn.show { opacity: 1; }
  #content-col #wide-user-turn.fade { opacity: 0; }
  #content-col #wide-agent-turn {
    font-size: 1.05rem;
    line-height: 1.75;
    color: var(--text);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    opacity: 0;
    transition: opacity 0.35s ease;
    max-height: calc(100dvh - 8rem);
  }
  #content-col #wide-agent-turn.show { opacity: 1; }
  #content-col #wide-agent-turn p { margin-bottom: 0.75em; }
  #content-col #wide-agent-turn p:last-child { margin-bottom: 0; }
  #content-col #wide-agent-turn strong { color: #fff; font-weight: 600; }
  #content-col #wide-agent-turn em { color: var(--muted); font-style: italic; }
  #content-col #wide-agent-turn ul { padding-left: 1.2em; margin: 0.5em 0; }
  #content-col #wide-agent-turn li { margin-bottom: 0.3em; }
  #content-col #wide-agent-turn h3 { font-size: 1rem; font-weight: 600; margin: 0.75em 0 0.35em; color: #fff; }
  #content-col #wide-agent-turn blockquote {
    border-left: 2px solid var(--border);
    padding-left: 1em;
    color: var(--muted);
    font-style: italic;
  }
  #content-col #wide-typing {
    display: none; gap: 5px; align-items: center; height: 1.5rem;
  }
  #content-col #wide-typing span {
    width: 5px; height: 5px; background: var(--muted);
    border-radius: 50%; animation: pulse 1.2s ease-in-out infinite;
  }
  #content-col #wide-typing span:nth-child(2) { animation-delay: 0.2s; }
  #content-col #wide-typing span:nth-child(3) { animation-delay: 0.4s; }
}

</style>
</head>
<body>
<div id="app">

  <!-- ═══ SMALL SCREEN LAYOUT (mobile) ═══ -->
  <div id="header">
    <span id="header-name">Ask <em>EthanExpert</em></span>
  </div>

  <!-- Hero (first load) -->
  <div id="hero">
    <div id="hero-title">
      <div id="hero-title-main">Ask <em>EthanExpert</em></div>
      <div id="hero-subtitle">Explore the world of Ethan Watters</div>
    </div>
    <div id="hero-question"></div>
    <div id="hero-input-area">
      <div class="input-wrap">
        <textarea id="hero-input" class="input-field" placeholder="Type here…" rows="1"
          onkeydown="handleKey(event,'hero')"
          oninput="autoResize(this)"></textarea>
        <span class="send-hint">↵ send</span>
      </div>
    </div>
  </div>

  <!-- Single-exchange display (chat mode) -->
  <div id="exchange">
    <div id="user-turn"></div>
    <div id="agent-turn">
      <div id="typing"><span></span><span></span><span></span></div>
    </div>
  </div>

  <!-- Bottom input (chat mode) -->
  <div id="chat-input-area">
    <div class="input-wrap">
      <textarea id="chat-input" class="input-field" placeholder="Type here…" rows="1"
        onkeydown="handleKey(event,'chat')"
        oninput="autoResize(this)"></textarea>
      <span class="send-hint">↵ send</span>
    </div>
  </div>

  <!-- ═══ LARGE SCREEN LAYOUT (≥ 768px) ═══ -->
  <div id="sidebar-col">
    <!-- Hero state: title + question + input -->
    <div id="wide-hero-title">
      <div id="sidebar-header-name">Ask <em>EthanExpert</em></div>
      <div id="sidebar-header-sub">Explore the world of Ethan Watters</div>
    </div>
    <div id="wide-hero-question"></div>
    <div id="sidebar-input-area">
      <div class="input-wrap">
        <textarea id="wide-input" class="input-field" placeholder="Type here…" rows="1"
          onkeydown="handleKey(event,'wide')"
          oninput="autoResize(this)"></textarea>
        <span class="send-hint">↵ send</span>
      </div>
    </div>
  </div>

  <div id="content-col">
    <div id="wide-exchange">
      <div id="wide-user-turn"></div>
      <div id="wide-agent-turn">
        <div id="wide-typing"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>

</div>
<script>
const PROXY = 'https://ethan-expert-proxy.threedwag.workers.dev';
const SYSTEM_PROMPT_FALLBACK = `You are EthanExpert — a deeply informed AI representative for Ethan Watters, American journalist and author (Crazy Like Us, Urban Tribes, Making Monsters). Answer questions about his work, career, ideas, and opportunities. Be warm, precise, evidence-based. Never invent facts.`;

let systemPrompt = SYSTEM_PROMPT_FALLBACK;
let currentMode  = 'curious';
let history      = [];
let busy         = false;
let chatStarted  = false;
let flowState    = 'waiting_topic';

const PERSONAS = [
  { key: 'curious',      label: 'Curious reader' },
  { key: 'publisher',    label: 'Publisher or editor' },
  { key: 'speaker',      label: 'Event organizer or booker' },
  { key: 'academic',     label: 'Researcher or academic' },
  { key: 'collaborator', label: 'Potential collaborator' },
  { key: 'recruiter',    label: 'Recruiter or hiring manager' },
  { key: 'other',        label: 'Something else' },
];

// ── INIT ──────────────────────────────────────────────────────────
async function init() {
  if (new URLSearchParams(window.location.search).has('secret-agent-ethan')) {
    window.location.href = '/admin.html'; return;
  }
  try {
    const res = await fetch(`${PROXY}/config`);
    const { config } = await res.json();
    if (config?.system_prompt) systemPrompt = config.system_prompt;
  } catch (e) {}

  await heroSays("What do you want to know?");
  document.getElementById('hero-input').focus();
}

// ── HERO ──────────────────────────────────────────────────────────
function isWide() { return window.innerWidth >= 768; }

async function heroSays(text, htmlExtra) {
  const dots = '<div style="display:flex;gap:5px;align-items:center;height:1.5rem">' +
    '<span style="width:5px;height:5px;background:var(--muted);border-radius:50%;animation:pulse 1.2s ease-in-out infinite"></span>'.repeat(3) +
    '</div>';
  // Small screen
  document.getElementById('hero-question').innerHTML = dots;
  // Wide screen
  document.getElementById('wide-hero-question').innerHTML = dots;
  await delay(420);
  const html = renderMarkdown(text) + (htmlExtra || '');
  document.getElementById('hero-question').innerHTML = html;
  document.getElementById('wide-hero-question').innerHTML = html;
  document.getElementById(isWide() ? 'wide-input' : 'hero-input').focus();
}
// ── SWITCH TO CHAT LAYOUT ─────────────────────────────────────────
function switchToChatLayout() {
  if (chatStarted) return;
  chatStarted = true;
  // Small screen
  document.getElementById('hero').classList.add('hidden');
  document.getElementById('header').classList.add('visible');
  document.getElementById('exchange').classList.add('visible');
  document.getElementById('chat-input-area').classList.add('visible');
  // Wide screen — hide the question from sidebar, keep title
  document.getElementById('wide-hero-question').style.display = 'none';
  document.getElementById('chat-input').focus();
}

// ── INPUT ─────────────────────────────────────────────────────────
function handleKey(e, src) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(src); }
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 128) + 'px';
}
async function submit(src) {
  if (busy) return;
  const id = src === 'hero' ? 'hero-input' : src === 'wide' ? 'wide-input' : 'chat-input';
  const el = document.getElementById(id);
  const text = el.value.trim();
  if (!text) return;
  el.value = ''; el.style.height = 'auto';
  // Also clear the other input
  if (src === 'wide') { const ci = document.getElementById('chat-input'); if(ci) ci.value=''; }
  if (src === 'chat') { const wi = document.getElementById('wide-input'); if(wi) wi.value=''; }
  await handleUserInput(text);
}

// ── CONVERSATION FLOW ─────────────────────────────────────────────
async function handleUserInput(text) {
  busy = true;

  if (flowState === 'waiting_topic') {
    switchToChatLayout();
    showUserTurn(text);
    history.push({ role: 'user', content: text });
    flowState = 'waiting_persona';
    await showAgentTurn("Who are you?", buildPersonaChoices());

  } else if (flowState === 'waiting_persona') {
    showUserTurn(text);
    setPersonaFromText(text);
    history.push({ role: 'user', content: text });
    flowState = 'chatting';
    await sendToAgent();

  } else {
    showUserTurn(text);
    history.push({ role: 'user', content: text });
    await sendToAgent();
  }

  busy = false;
}

// ── EXCHANGE DISPLAY ──────────────────────────────────────────────
function showUserTurn(text) {
  // Small screen
  const u = document.getElementById('user-turn');
  u.textContent = text;
  u.classList.remove('fade'); u.classList.add('show');
  // Wide screen
  const wu = document.getElementById('wide-user-turn');
  wu.textContent = text;
  wu.classList.remove('fade'); wu.classList.add('show');
}

async function showAgentTurn(text, htmlExtra) {
  // Fade out user turns
  document.getElementById('user-turn').classList.add('fade');
  document.getElementById('wide-user-turn').classList.add('fade');

  // Show typing in both
  const a  = document.getElementById('agent-turn');
  const wa = document.getElementById('wide-agent-turn');
  a.classList.remove('show');
  wa.classList.remove('show');
  document.getElementById('typing').style.display      = 'flex';
  document.getElementById('wide-typing').style.display = 'flex';
  await delay(500);

  // Render in both
  document.getElementById('typing').style.display      = 'none';
  document.getElementById('wide-typing').style.display = 'none';

  const html = renderMarkdown(text) + (htmlExtra || '');

  // Small screen — re-append typing element
  a.innerHTML = html;
  const t1 = document.createElement('div');
  t1.id = 'typing'; t1.style.display = 'none';
  t1.innerHTML = '<span></span><span></span><span></span>';
  a.appendChild(t1);

  // Wide screen — re-append typing element
  wa.innerHTML = html;
  const t2 = document.createElement('div');
  t2.id = 'wide-typing'; t2.style.display = 'none';
  t2.innerHTML = '<span></span><span></span><span></span>';
  wa.appendChild(t2);

  a.classList.add('show');
  wa.classList.add('show');
}

function buildPersonaChoices() {
  return '<div class="persona-choices">' +
    PERSONAS.map(p =>
      `<button class="persona-choice" onclick="choosePersona('${p.key}','${escapeAttr(p.label)}')">${p.label}</button>`
    ).join('') + '</div>';
}

async function choosePersona(key, label) {
  if (busy) return;
  busy = true;
  currentMode = key;
  showUserTurn(label);
  history.push({ role: 'user', content: label });
  flowState = 'chatting';
  await sendToAgent();
  busy = false;
}

function setPersonaFromText(text) {
  const t = text.toLowerCase();
  for (const p of PERSONAS) {
    if (t.includes(p.key) || t.includes(p.label.toLowerCase())) { currentMode = p.key; return; }
  }
}

// ── AGENT CALL ────────────────────────────────────────────────────
async function sendToAgent() {
  // Show typing in agent turn
  const u = document.getElementById('user-turn');
  u.classList.add('fade');
  const a = document.getElementById('agent-turn');
  a.classList.remove('show');
  document.getElementById('typing').style.display      = 'flex';
  const wt = document.getElementById('wide-typing');
  if (wt) wt.style.display = 'flex';

  const wi = document.getElementById('wide-input');
  document.getElementById('chat-input').disabled = true;
  if (wi) wi.disabled = true;
  try {
    const res = await fetch(PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        system: systemPrompt + `\n\n[USER MODE: ${currentMode}]`,
        messages: history,
        max_tokens: 1500,
      }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    const reply = data.content?.[0]?.text || '(no response)';
    history.push({ role: 'assistant', content: reply });
    await showAgentTurn(reply);
  } catch (e) {
    await showAgentTurn(`*Something went wrong — ${e.message}*`);
  } finally {
    document.getElementById('chat-input').disabled = false;
    document.getElementById('chat-input').focus();
    const wi2 = document.getElementById('wide-input');
    if (wi2) { wi2.disabled = false; if (isWide()) wi2.focus(); }
  }
}

// ── UTILS ─────────────────────────────────────────────────────────
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
function escapeHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(t) { return t.replace(/'/g,"&#39;").replace(/"/g,'&quot;'); }

function renderMarkdown(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`(.*?)`/g, '<code>$1</code>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^[-•] (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)/g, m => `<ul>${m}</ul>`)
    .split(/\n\n+/)
    .map(para => {
      para = para.trim();
      if (!para) return '';
      if (/^<(h3|ul|blockquote)/.test(para)) return para;
      return `<p>${para.replace(/\n/g,'<br>')}</p>`;
    })
    .join('');
}

init();
</script>
</body>
</html>
