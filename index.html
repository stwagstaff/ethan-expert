<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who is Ethan Watters?</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #1a1008;
  --surface: #201408;
  --border:  #3a2a1a;
  --text:    #e8e8e8;
  --muted:   #888;
  --accent:  #c4622d;
  --font:    'Georgia', serif;
  --mono:    system-ui, -apple-system, sans-serif;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
}

/* ── LAYOUT ── */
#app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 680px;
  margin: 0 auto;
  padding: 0 1.5rem;
}

/* ── HEADER ── */
#header {
  padding: 2rem 0 0;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.6s ease;
}
#header.visible { opacity: 1; }
#header-name {
  font-size: clamp(1rem, 2.5vw, 1.15rem);
  font-weight: normal;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-family: var(--mono);
}
#header-name em {
  font-style: normal;
  color: var(--accent);
}

/* ── MESSAGES ── */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 2rem 0 1rem;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
  scrollbar-width: none;
}
#messages::-webkit-scrollbar { display: none; }

.msg { display: flex; flex-direction: column; gap: 0.25rem; }

.msg-text {
  font-size: 1.05rem;
  line-height: 1.7;
  color: var(--text);
}
.msg-text p { margin-bottom: 0.75em; }
.msg-text p:last-child { margin-bottom: 0; }
.msg-text strong { color: #fff; font-weight: 600; }
.msg-text em { color: var(--muted); font-style: italic; }
.msg-text ul { padding-left: 1.2em; margin: 0.5em 0; }
.msg-text li { margin-bottom: 0.3em; }
.msg-text h3 { font-size: 1rem; font-weight: 600; margin: 0.75em 0 0.35em; color: #fff; }
.msg-text blockquote {
  border-left: 2px solid var(--border);
  padding-left: 1em;
  color: var(--muted);
  font-style: italic;
}

.msg.user .msg-text {
  color: var(--muted);
  font-size: 0.95rem;
}

/* ── PERSONA CHOICES ── */
.persona-choices {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-top: 0.5rem;
}
.persona-choice {
  background: none;
  border: none;
  border-left: 1px solid var(--border);
  padding: 0.4rem 0 0.4rem 1rem;
  font-family: var(--font);
  font-size: 0.95rem;
  color: var(--muted);
  cursor: pointer;
  text-align: left;
  transition: color 0.15s, border-color 0.15s;
}
.persona-choice:hover {
  color: var(--text);
  border-left-color: var(--accent);
}

/* ── TYPING INDICATOR ── */
#typing {
  display: none;
  gap: 5px;
  align-items: center;
  height: 1.5rem;
}
#typing span {
  width: 5px; height: 5px;
  background: var(--muted);
  border-radius: 50%;
  animation: pulse 1.2s ease-in-out infinite;
}
#typing span:nth-child(2) { animation-delay: 0.2s; }
#typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse {
  0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1); }
}

/* ── INPUT ── */
#input-area {
  flex-shrink: 0;
  padding: 0.75rem 0 1.5rem;
  border-top: 1px solid var(--border);
}
#input-wrap {
  display: flex;
  align-items: flex-end;
  gap: 0.75rem;
}
#chat-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.6;
  resize: none;
  height: 2rem;
  max-height: 8rem;
  padding: 0.2rem 0;
  caret-color: var(--accent);
}
#chat-input::placeholder { color: var(--border); }
#send-hint {
  font-size: 0.72rem;
  color: var(--border);
  font-family: var(--mono);
  flex-shrink: 0;
  padding-bottom: 0.3rem;
  transition: color 0.15s;
}
#chat-input:focus ~ #send-hint { color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <div id="header"><span id="header-name">Ask <em>EthanExpert</em></span></div>
  <div id="messages">
    <div id="typing"><span></span><span></span><span></span></div>
  </div>
  <div id="input-area">
    <div id="input-wrap">
      <textarea id="chat-input" placeholder="Type here…" rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"></textarea>
      <span id="send-hint">↵ send</span>
    </div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────
const PROXY = 'https://ethan-expert-proxy.threedwag.workers.dev';

// Fallback system prompt stub — real one loaded from KV on init
const SYSTEM_PROMPT_FALLBACK = `You are EthanExpert — a deeply informed AI representative for Ethan Watters, American journalist and author (Crazy Like Us, Urban Tribes, Making Monsters). Answer questions about his work, career, ideas, and opportunities. Be warm, precise, evidence-based. Never invent facts.`;

// ── STATE ─────────────────────────────────────────────────────────
let systemPrompt = SYSTEM_PROMPT_FALLBACK;
let currentMode  = 'curious';
let history      = [];   // full conversation history for the API
let busy         = false;
let onboardingDone = false;

const PERSONAS = [
  { key: 'curious',      label: 'Curious reader' },
  { key: 'publisher',    label: 'Publisher or editor' },
  { key: 'speaker',      label: 'Event organizer or booker' },
  { key: 'academic',     label: 'Researcher or academic' },
  { key: 'collaborator', label: 'Potential collaborator' },
  { key: 'recruiter',    label: 'Recruiter or hiring manager' },
  { key: 'other',        label: 'Something else' },
];

// ── INIT ──────────────────────────────────────────────────────────
async function init() {
  // Redirect to admin if ?secret-agent-ethan
  if (new URLSearchParams(window.location.search).has('secret-agent-ethan')) {
    window.location.href = '/admin.html';
    return;
  }

  // Load live config from KV silently
  try {
    const res  = await fetch(`${PROXY}/config`);
    const { config } = await res.json();
    if (config?.system_prompt) systemPrompt = config.system_prompt;
  } catch (e) { /* use fallback */ }

  // Show header
  document.getElementById('header').classList.add('visible');

  // Start the conversation: agent speaks first
  await agentSays("What do you want to know?");
}

// ── CONVERSATION HELPERS ──────────────────────────────────────────
function msgEl(role, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const t = document.createElement('div');
  t.className = 'msg-text';
  t.innerHTML = html;
  d.appendChild(t);
  return d;
}

function appendMsg(el) {
  const msgs = document.getElementById('messages');
  const typing = document.getElementById('typing');
  msgs.insertBefore(el, typing);
  msgs.scrollTop = msgs.scrollHeight;
}

async function agentSays(text, htmlExtra) {
  showTyping(true);
  await delay(420);
  showTyping(false);
  const el = msgEl('agent', renderMarkdown(text) + (htmlExtra || ''));
  appendMsg(el);
}

function userSaid(text) {
  appendMsg(msgEl('user', escapeHtml(text)));
}

function showTyping(on) {
  document.getElementById('typing').style.display = on ? 'flex' : 'none';
  if (on) {
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
  }
}

// ── INPUT HANDLING ────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submit();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 128) + 'px';
}

async function submit() {
  if (busy) return;
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  await handleUserInput(text);
}

// ── ONBOARDING FLOW ───────────────────────────────────────────────
// State machine: waiting_topic → waiting_persona → chatting
let flowState = 'waiting_topic';
let userTopic = '';

async function handleUserInput(text) {
  busy = true;

  if (flowState === 'waiting_topic') {
    // User answered "What do you want to know?"
    userTopic = text;
    userSaid(text);
    history.push({ role: 'user', content: text });
    flowState = 'waiting_persona';

    // Ask who they are, offer persona choices
    const choicesHtml = buildPersonaChoices();
    await agentSays("Who are you?", choicesHtml);

  } else if (flowState === 'waiting_persona') {
    // User typed a free-form persona answer
    userSaid(text);
    setPersonaFromText(text);
    history.push({ role: 'user', content: text });
    flowState = 'chatting';
    await sendToAgent();

  } else {
    // Normal chat
    userSaid(text);
    history.push({ role: 'user', content: text });
    await sendToAgent();
  }

  busy = false;
}

function buildPersonaChoices() {
  const html = PERSONAS.map(p =>
    `<button class="persona-choice" onclick="choosePersona('${p.key}', '${escapeAttr(p.label)}')">${p.label}</button>`
  ).join('');
  return `<div class="persona-choices">${html}</div>`;
}

async function choosePersona(key, label) {
  if (busy) return;
  busy = true;
  // Remove the choice buttons
  document.querySelectorAll('.persona-choices').forEach(el => el.remove());

  currentMode = key;
  userSaid(label);
  history.push({ role: 'user', content: label });
  flowState = 'chatting';
  await sendToAgent();
  busy = false;
}

function setPersonaFromText(text) {
  const t = text.toLowerCase();
  for (const p of PERSONAS) {
    if (t.includes(p.key) || t.includes(p.label.toLowerCase())) {
      currentMode = p.key;
      return;
    }
  }
  // Default — leave as curious
}

// ── AGENT CALL ────────────────────────────────────────────────────
async function sendToAgent() {
  showTyping(true);
  document.getElementById('chat-input').disabled = true;

  try {
    const modeNote = `\n\n[USER MODE: ${currentMode}]`;
    const active = systemPrompt + modeNote;

    const res = await fetch(PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        system: active,
        messages: history,
        max_tokens: 1500,
      }),
    });

    showTyping(false);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

    const reply = data.content?.[0]?.text || '(no response)';
    history.push({ role: 'assistant', content: reply });
    appendMsg(msgEl('agent', renderMarkdown(reply)));
    document.getElementById('messages').scrollTop = 99999;

  } catch (e) {
    showTyping(false);
    appendMsg(msgEl('agent', `<em style="color:#888">Something went wrong — ${e.message}</em>`));
  } finally {
    document.getElementById('chat-input').disabled = false;
    document.getElementById('chat-input').focus();
  }
}

// ── UTILITIES ─────────────────────────────────────────────────────
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(t) {
  return t.replace(/'/g, '&#39;').replace(/"/g, '&quot;');
}

function renderMarkdown(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`(.*?)`/g, '<code>$1</code>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^[-•] (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)/g, m => `<ul>${m}</ul>`)
    .split(/\n\n+/)
    .map(para => {
      para = para.trim();
      if (!para) return '';
      if (/^<(h3|ul|blockquote)/.test(para)) return para;
      return `<p>${para.replace(/\n/g, '<br>')}</p>`;
    })
    .join('');
}

// ── START ─────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
